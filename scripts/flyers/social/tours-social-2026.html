<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>La Vieja Adventures · Serie social de tours</title>
  <style>
    :root{
      --turquoise:#00c4b0;--ink:#2e2a25;--paper:#f5f3ed;--white:#fff;
      --muted:#d9e7e2;--soft:#c8fff5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:#d9dfdc;font-family:Inter,"Segoe UI",Arial,sans-serif}
    body{display:grid;gap:48px;justify-content:center;padding:48px}
    .flyer{
      --accent:#00c4b0;
      position:relative;width:1080px;height:1350px;overflow:hidden;
      color:var(--white);background:var(--ink);isolation:isolate;
      box-shadow:0 24px 80px rgba(17,31,27,.22);
    }
    .hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.08) contrast(1.04)}
    .veil{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(18,22,20,.20) 0%,rgba(20,28,25,.05) 26%,rgba(20,28,25,.20) 48%,rgba(20,28,25,.96) 100%),
      linear-gradient(90deg,rgba(20,28,25,.38),transparent 55%)}
    .grain{position:absolute;inset:0;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
    .curve{position:absolute;z-index:1;width:700px;height:220px;border:3px solid color-mix(in srgb,var(--accent) 72%,transparent);border-radius:50%;transform:rotate(-17deg)}
    .curve.one{right:-420px;top:275px}.curve.two{right:-350px;top:345px;opacity:.55}
    .top{position:absolute;z-index:3;left:68px;right:68px;top:56px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:18px}
    .logo{width:112px;height:112px;object-fit:cover;border-radius:50%;border:4px solid var(--accent);box-shadow:0 8px 28px rgba(0,0,0,.25)}
    .brand-copy strong{display:block;font-size:27px;line-height:1;letter-spacing:.4px}
    .brand-copy span{display:block;margin-top:8px;color:#e5f5f1;font-size:15px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase}
    .edition{padding:12px 19px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(24,35,31,.30);backdrop-filter:blur(12px);font-size:15px;font-weight:850;letter-spacing:1.7px;text-transform:uppercase}
    .index{position:absolute;z-index:3;left:68px;top:250px;color:var(--accent);font-size:21px;font-weight:900;letter-spacing:3px}
    .index:after{content:"";display:inline-block;width:92px;height:3px;margin:0 0 6px 16px;background:var(--accent)}
    .content{position:absolute;z-index:3;left:68px;right:68px;bottom:64px}
    .eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px;padding:11px 17px;border-radius:999px;color:var(--ink);background:var(--accent);font-size:17px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}
    h1{max-width:920px;margin:0;font-family:"Arial Narrow","Roboto Condensed","Segoe UI",sans-serif;font-size:82px;line-height:.94;letter-spacing:-3.2px;text-transform:uppercase;text-wrap:balance}
    .hook{max-width:790px;margin:27px 0 26px;color:#f2f7f5;font-size:27px;font-weight:560;line-height:1.35;text-wrap:balance}
    .facts{display:flex;flex-wrap:wrap;gap:13px;margin-bottom:25px}
    .fact{display:flex;align-items:center;gap:10px;padding:13px 17px;border:1px solid rgba(255,255,255,.22);border-radius:16px;background:rgba(255,255,255,.10);backdrop-filter:blur(12px);font-size:17px;font-weight:800}
    .fact i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
    .footer{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding-top:23px;border-top:1px solid rgba(255,255,255,.24)}
    .safety{max-width:675px;color:#d8e5e1;font-size:15px;line-height:1.4}
    .cta{text-align:right}
    .cta strong{display:block;color:var(--accent);font-size:22px}
    .cta span{display:block;margin-top:5px;font-size:16px;font-weight:750}
    .tagline{position:absolute;z-index:2;right:-40px;top:535px;transform:rotate(90deg);transform-origin:center;color:rgba(255,255,255,.58);font-size:15px;font-weight:900;letter-spacing:5px;text-transform:uppercase}
  </style>
</head>
<body>
  <main id="flyers"></main>
  <script>
    const tours = [
      {slug:"01-ciudad-esmeralda",n:"01",image:"../assets/tours/ciudad-esmeralda.jpg",accent:"#00c4b0",tag:"La de la casa",title:"Ciudad Esmeralda",hook:"Camine entre paredes de roca, agua turquesa y la fuerza viva del Cañón del Río La Vieja.",duration:"3–4 horas",level:"Moderado",place:"Sucre · San Carlos",safety:"Aventura con guía. Requiere buena condición física. La ruta depende del clima, el nivel del río y la valoración operativa."},
      {slug:"02-avistamiento-aves",n:"02",image:"../assets/tours/aves.jpg",accent:"#a9df50",tag:"Bosque vivo",title:"Avistamiento de Aves",hook:"Escuche primero. Observe después. Descubra las aves del corredor biológico Juan Castro Blanco.",duration:"2 horas",level:"Fácil",place:"Juan Castro Blanco",safety:"Recorrido guiado y de ritmo tranquilo. La observación de fauna depende de las condiciones naturales del día."},
      {slug:"03-volcanes-dormidos",n:"03",image:"../assets/tours/volcanes.jpg",accent:"#ffb34f",tag:"Tierra antigua",title:"Volcanes Dormidos",hook:"Explore cráteres antiguos, bosque nuboso y miradores que cuentan la historia volcánica de la Zona Norte.",duration:"3–4 horas",level:"Moderado",place:"Parque Nacional del Agua",safety:"Caminata guiada. Use calzado adecuado; la ruta puede ajustarse por clima, terreno o condiciones del parque."},
      {slug:"04-lluvia-naturaleza",n:"04",image:"../assets/tours/lluvia.jpg",accent:"#77d7ff",tag:"Experiencia sensorial",title:"Lluvia en la Naturaleza",hook:"Bosque mojado, aroma a tierra y el sonido del agua: una forma distinta de sentir Costa Rica.",duration:"1 hora",level:"Fácil",place:"Sucre · San Carlos",safety:"Incluye orientación para lluvia. El recorrido se modifica o suspende ante tormenta, terreno inestable o riesgo operativo."},
      {slug:"05-cascadas-secretas",n:"05",image:"../assets/tours/cascadas.jpg",accent:"#4de0cf",tag:"Naturaleza escondida",title:"Cascadas Secretas",hook:"Siga el río hasta rincones escondidos, pozas frescas y cascadas perfectas para bajar revoluciones.",duration:"2–3 horas",level:"Moderado",place:"Río La Vieja · Sucre",safety:"Baño y acceso sujetos al clima y al nivel del río. Siempre siga las indicaciones del guía."},
      {slug:"06-tour-nocturno",n:"06",image:"../assets/tours/nocturno.jpg",accent:"#bda5ff",tag:"Después del atardecer",title:"Tour Nocturno",hook:"Cuando cae la noche, el bosque cambia de voz: ranas, insectos, rastros y ojos que brillan.",duration:"1,5 horas",level:"Fácil",place:"Sucre · San Carlos",safety:"Recorrido guiado. No toque ni alimente fauna; use calzado cerrado y permanezca con el grupo."},
      {slug:"07-gastronomico-local",n:"07",image:"../assets/tours/gastronomico.jpg",accent:"#ff9e8c",tag:"Sabor norteño",title:"Tour Gastronómico Local",hook:"Sabores de la zona, recetas ticas e historias compartidas por la gente que les da vida.",duration:"1,5 horas",level:"Fácil",place:"Sucre · San Carlos",safety:"Informe previamente alergias, restricciones alimentarias o necesidades especiales al coordinar la experiencia."},
      {slug:"08-cuadra-tours",n:"08",image:"../assets/tours/cuadra-tours.jpg",accent:"#ffc64d",tag:"Adrenalina norteña",title:"Cuadra-Tours Aventura",hook:"Senderos privados, bosque, finca y barro de temporada: pura vida sobre cuatro ruedas.",duration:"1,5–2 horas",level:"Intermedio",place:"Zona Norte",safety:"Inducción y equipo de seguridad obligatorios. La ruta se adapta al clima, el terreno y la experiencia del grupo."},
      {slug:"09-rapel-canon",n:"09",image:"../assets/tours/rapel.jpg",accent:"#ff765f",tag:"Aventura vertical",title:"Rapel en Cañón",hook:"Descienda de forma controlada entre roca y río con equipo profesional y acompañamiento experto.",duration:"2 horas",level:"Intermedio–avanzado",place:"Cañón del Río La Vieja",safety:"Requiere buena condición física, briefing, equipo y guía. Sujeto al clima, caudal y valoración operativa."}
    ];
    const root = document.querySelector("#flyers");
    root.innerHTML = tours.map(t => `
      <article class="flyer" id="${t.slug}" style="--accent:${t.accent}">
        <img class="hero" src="${t.image}" alt="">
        <div class="veil"></div><div class="grain"></div>
        <div class="curve one"></div><div class="curve two"></div>
        <header class="top">
          <div class="brand">
            <img class="logo" src="../../../.agents/skills/la-vieja-brand-design/assets/logos/logo-primary-dark.jpg" alt="La Vieja Adventures">
            <div class="brand-copy"><strong>La Vieja Adventures</strong><span>San Carlos · Costa Rica</span></div>
          </div>
          <span class="edition">Experiencias 2026</span>
        </header>
        <div class="index">TOUR ${t.n}</div>
        <div class="tagline">Aventura auténtica · Guías locales</div>
        <section class="content">
          <div class="eyebrow">${t.tag}</div>
          <h1>${t.title}</h1>
          <p class="hook">${t.hook}</p>
          <div class="facts">
            <span class="fact"><i></i>${t.duration}</span>
            <span class="fact"><i></i>${t.level}</span>
            <span class="fact"><i></i>${t.place}</span>
          </div>
          <footer class="footer">
            <div class="safety">${t.safety}</div>
            <div class="cta"><strong>Reserve su aventura</strong><span>WhatsApp +506 6233-2535</span></div>
          </footer>
        </section>
      </article>`).join("");
    window.flyerTours = tours;
  </script>
</body>
</html>
